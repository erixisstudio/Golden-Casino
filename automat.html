<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot - Golden Casino</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#45bd4f;
    font-family:Arial;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}

.slot{
    width:800px;
    background:#1d1d1d;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,0.7);
}

.money{
    font-size:28px;
    margin-bottom:20px;
}

.reels{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px 0;
}

.reel{
    width:90px;
    height:90px;
    background:#2b2b2b;
    border:4px solid #444;
    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;

    transition:0.2s;
}

/* animacja spin */
.spinning{
    animation:spinAnim 0.1s infinite;
}

@keyframes spinAnim{

    0%{
        transform:translateY(-5px);
    }

    50%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(-5px);
    }

}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:15px;
    background:gold;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

#result{
    min-height:40px;
}

.win{
    color:lime;
}

.lose{
    color:red;
}

.info{
    margin-top:25px;
    background:#252525;
    padding:20px;
    border-radius:15px;
    text-align:left;
    line-height:1.7;
}

</style>
</head>
<body>

<a href="index.html">dom</a>
<div class="slot">

    <h1>Slot</h1>

    <div class="money">
        💰 Pieniądze:
        <span id="money">100</span>$
    </div>

    <!-- 5 bębnów -->
    <div class="reels">

        <div class="reel" id="r1">❓</div>
        <div class="reel" id="r2">❓</div>
        <div class="reel" id="r3">❓</div>
        <div class="reel" id="r4">❓</div>
        <div class="reel" id="r5">❓</div>

    </div>

    <button onclick="spin()" id="spinBtn">
        SPIN - 5000$
    </button>

    <h2 id="result"></h2>

    <div class="info">

        <b>Zasady:</b>

        <ul>
            <li>5 takich samych = JACKPOT 300k</li>
            <li>4 takich samych = duża wygrana 10k</li>
            <li>3 takich samych = mała wygrana 7k</li>
            <li>mniej = przegrana</li>
            <li>pięć 🟪 = giga JACKPOT 1mln </li>
        </ul>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let money = parseInt(localStorage.getItem("money")) || 1000;
    document.getElementById("money").innerText = money;
});
const symbols = [
    "7️⃣",
    "💎",
    "🍒",
    "🍋",
    "🔔",
    "🟪"
];

let money = parseInt(localStorage.getItem("money")) || 1000;

function randomSymbol(){

    let randomIndex = Math.floor(
        Math.random() * symbols.length
    );

    return symbols[randomIndex];
}
document.addEventListener("keydown", function(event) {

    if(event.key.toLowerCase() === "t") {
        document.getElementById("spinBtn").click();
    }

});
function spin(){
localStorage.setItem("money", money);
    if(money < 10){
        alert("Nie masz pieniędzy XD");
        return;
    }

    money -= 5000;

    document.getElementById("money").innerText = money;

    let result = document.getElementById("result");
    result.innerHTML = "🎰 Kręcenie...";
    result.className = "";

    let spinBtn = document.getElementById("spinBtn");
    spinBtn.disabled = true;

    // wszystkie bębny
    let reels = [
        document.getElementById("r1"),
        document.getElementById("r2"),
        document.getElementById("r3"),
        document.getElementById("r4"),
        document.getElementById("r5")
    ];

    // dodanie animacji
    reels.forEach(reel => {
        reel.classList.add("spinning");
    });

    // fake spinning
    let spinning = setInterval(() => {

        reels.forEach(reel => {
            reel.innerText = randomSymbol();
        });

    }, 100);

    // zatrzymanie po 2 sekundach
    setTimeout(() => {

        clearInterval(spinning);

        // finalne symbole
        let finalSymbols = [];

        reels.forEach((reel, index) => {

            let symbol = randomSymbol();

            reel.innerText = symbol;

            reel.classList.remove("spinning");

            finalSymbols.push(symbol);

        });

        checkWin(finalSymbols);

        spinBtn.disabled = false;

    }, 2000);

}

function checkWin(finalSymbols){

    let result = document.getElementById("result");
    let counts = {};

    finalSymbols.forEach(symbol => {
        counts[symbol] = (counts[symbol] || 0) + 1;
    });

    let max = Math.max(...Object.values(counts));
    let bestSymbol = Object.keys(counts).find(k => counts[k] === max);

    let payout = 0;
    let text = "";
    let className = "lose";

    // 🧨 SCALING SYSTEM 3–10
    if (max >= 3) {

        if (max === 3) {
            payout = 7000;
            text = "🎉 TRIPLE WIN +7K";
        }

        else if (max === 4) {
            payout = 20000;
            text = "💎 QUAD WIN +20K";
        }

        else if (max === 5) {
            payout = 300000;
            text = "🔥 JACKPOT +300K";
        }

        else if (max === 6) {
            payout = 1000000;
            text = "🚀 MEGA JACKPOT +1M";
        }

        else if (max === 7) {
            payout = 5000000;
            text = "🌌 ULTRA JACKPOT +5M";
        }

        else if (max === 8) {
            payout = 20000000;
            text = "💀 GODLIKE WIN +20M";
        }

        else if (max === 9) {
            payout = 50000000;
            text = "👑 LEGENDARY JACKPOT +50M";
        }

        else if (max === 10) {
            payout = 100000000;
            text = "🔥 INFINITE GOD WIN +100M";
        }

        className = "win";
    }
    else {
        text = "❌ NIC NIE WYGRAŁEŚ";
        className = "lose";
    }

    // 🟪 BONUS LAYER (special symbol)
    if (bestSymbol === "🟪" && max >= 5) {
        payout += 1000000;
        text += " + 🟪 BONUS +1M";
    }

    money += payout;

    result.innerHTML = text;
    result.className = className;

    document.getElementById("money").innerText = money;
}

</script>

</body>
</html>
