<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Roulette - Golden Casino</title>

<style>
body {
    margin: 0;
    background:#45bd4f;
    color: white;
    font-family: Arial;
    text-align: center;
}

canvas {
    background: #145c43;
    border-radius: 50%;
    margin-top: 20px;
}

.controls {
    margin-top: 20px;
}

button, select, input {
    padding: 10px;
    font-size: 16px;
    margin: 5px;
}

#money {
    font-size: 22px;
    color: gold;
}
</style>
</head>

<body>

<h1>Roulette</h1>

<div id="money">💰 0</div>

<canvas id="wheel" width="300" height="300"></canvas>

<div class="controls">
    <select id="betType">
        <option value="red">Red</option>
        <option value="black">Black</option>
        <option value="number">Number</option>
    </select>

    <input type="number" id="betAmount" value="100" min="1">

    <input type="number" id="betNumber" placeholder="0-36">

    <br>

    <button onclick="spin()">🎲 SPIN</button>
</div>

<div id="result">Wybierz zakład</div>

<a href="index.html">dom</a>
<script>

let money = parseInt(localStorage.getItem("money")) || 1000;
document.getElementById("money").innerText = "💰 " + money;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const numbers = Array.from({length: 37}, (_, i) => i);
let angle = 0;
document.addEventListener("DOMContentLoaded", function() {
    let money = parseInt(localStorage.getItem("money")) || 1000;
    document.getElementById("money").innerText = money;
});
const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function drawWheel() {
localStorage.setItem("money", money);
    const radius = 140;
    const step = (Math.PI * 2) / numbers.length;

    for (let i = 0; i < numbers.length; i++) {
        let start = angle + i * step;

        ctx.beginPath();
        ctx.moveTo(150,150);
        ctx.arc(150,150,radius,start,start+step);

        ctx.fillStyle = redNumbers.includes(i) ? "#b30000" : "#111";
        if (i === 0) ctx.fillStyle = "green";

        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(150,150);
        ctx.rotate(start + step/2);
        ctx.fillStyle = "white";
        ctx.fillText(i, 110, 5);
        ctx.restore();
    }
}

function saveMoney() {
    localStorage.setItem("money", money);
    document.getElementById("money").innerText = "💰 " + money;
}

function spin() {

    let betType = document.getElementById("betType").value;
    let betAmount = parseInt(document.getElementById("betAmount").value);
    let betNumber = parseInt(document.getElementById("betNumber").value);

    if (betAmount > money) {
        document.getElementById("result").innerText = "❌ Brak kasy";
        return;
    }

    money -= betAmount;

    let spins = 60 + Math.floor(Math.random() * 40);
    let target = Math.floor(Math.random() * 37);

    let i = 0;

    function animate() {
        angle += 0.1;
        ctx.clearRect(0,0,300,300);
        drawWheel();

        i++;
        if (i < spins) {
            requestAnimationFrame(animate);
        } else {
            finishSpin(target, betType, betAmount, betNumber);
        }
    }

    saveMoney();
    animate();
}
document.addEventListener("DOMContentLoaded", function() {
    let money = parseInt(localStorage.getItem("money")) || 1000;
    document.getElementById("money").innerText = money;
});
function finishSpin(result, betType, betAmount, betNumber) {

    let win = false;

    const isRed = redNumbers.includes(result);

    if (betType === "red" && isRed && result !== 0) win = true;
    if (betType === "black" && !isRed && result !== 0) win = true;
    if (betType === "number" && betNumber === result) win = true;

    if (win) {
        let payout = betAmount * (betType === "number" ? 35 : 2);
        money += payout;
        document.getElementById("result").innerText =
            "🔥 WYGRAŁEŚ! liczba: " + result + " +" + payout;
    } else {
        document.getElementById("result").innerText =
            "💀 Przegrałeś! liczba: " + result;
    }

    saveMoney();
}

// init
ctx.font = "12px Arial";
drawWheel();

</script>

</body>
</html>
