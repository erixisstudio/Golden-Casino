<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Roulette - Golden Casino</title>

<style>
body {
    margin: 0;
    background: #0f5132;
    color: white;
    font-family: Arial;
    text-align: center;
}

canvas {
    background: #145c43;
    border-radius: 50%;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.controls {
    margin-top: 20px;
}

button, select, input {
    padding: 10px;
    font-size: 16px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    background: gold;
    cursor: pointer;
    font-weight: bold;
}

#money {
    font-size: 24px;
    color: gold;
}

#result {
    margin-top: 15px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🎰 Roulette</h1>

<div id="money">💰 0</div>

<canvas id="wheel" width="300" height="300"></canvas>

<div class="controls">
    <select id="betType">
        <option value="red">Red</option>
        <option value="black">Black</option>
        <option value="number">Number</option>
    </select>

    <input type="number" id="betAmount" value="100" min="1">
    <input type="number" id="betNumber" placeholder="0-36">

    <br>

    <button onclick="spin()">🎲 SPIN</button>
</div>

<div id="result">Wybierz zakład</div>

<script>
let money = parseInt(localStorage.getItem("money")) || 1000;
document.getElementById("money").innerText = "💰 " + money;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const numbers = Array.from({length: 37}, (_, i) => i);
const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

let angle = 0;
let spinning = false;

function drawWheel() {
    const radius = 140;
    const step = (Math.PI * 2) / numbers.length;

    for (let i = 0; i < numbers.length; i++) {
        let start = angle + i * step;

        ctx.beginPath();
        ctx.moveTo(150,150);
        ctx.arc(150,150,radius,start,start+step);

        ctx.fillStyle = i === 0 ? "green" : (redNumbers.includes(i) ? "#b30000" : "#111");
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(150,150);
        ctx.rotate(start + step/2);
        ctx.fillStyle = "white";
        ctx.fillText(i, 110, 5);
        ctx.restore();
    }

    // 🎯 marker (piłka)
    ctx.beginPath();
    ctx.arc(150, 30, 6, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
}

function saveMoney() {
    localStorage.setItem("money", money);
    document.getElementById("money").innerText = "💰 " + money;
}

function spin() {
    if (spinning) return;
    spinning = true;

    let betType = document.getElementById("betType").value;
    let betAmount = parseInt(document.getElementById("betAmount").value);
    let betNumber = parseInt(document.getElementById("betNumber").value);

    if (betAmount > money) {
        document.getElementById("result").innerText = "❌ Brak kasy";
        spinning = false;
        return;
    }

    money -= betAmount;
    saveMoney();

    let target = Math.floor(Math.random() * 37);

    let duration = 5000; // ⬅️ DŁUŻSZA ANIMACJA
    let start = null;

    let startAngle = angle;
    let endAngle = startAngle + (Math.PI * 10) + (target * (2*Math.PI/37));

    function animate(time) {
        if (!start) start = time;
        let progress = (time - start) / duration;

        if (progress > 1) progress = 1;

        // ease-out
        let ease = 1 - Math.pow(1 - progress, 3);

        angle = startAngle + (endAngle - startAngle) * ease;

        ctx.clearRect(0,0,300,300);
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            finishSpin(target, betType, betAmount, betNumber);
            spinning = false;
        }
    }

    requestAnimationFrame(animate);
}

function finishSpin(result, betType, betAmount, betNumber) {
    const isRed = redNumbers.includes(result);
    let win = false;

    if (betType === "red" && isRed && result !== 0) win = true;
    if (betType === "black" && !isRed && result !== 0) win = true;
    if (betType === "number" && betNumber === result) win = true;

    if (win) {
        let payout = betAmount * (betType === "number" ? 35 : 2);
        money += payout;

        document.getElementById("result").innerText =
            `🔥 WIN! ${result} (${isRed ? "RED" : "BLACK"}) +${payout}`;
    } else {
        document.getElementById("result").innerText =
            `💀 LOSE! ${result} (${isRed ? "RED" : "BLACK"})`;
    }

    saveMoney();
}

// init
ctx.font = "12px Arial";
drawWheel();
</script>

</body>
</html>
