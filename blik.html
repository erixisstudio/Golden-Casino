<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>BLIK Steam Style</title>

<style>
body {
    font-family: Arial;
    background: #0b3d2e;
    color: white;
    text-align: center;
    padding: 30px;
}

.money {
    font-size: 22px;
    color: gold;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
    font-size: 16px;
}

.overlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup {
    background:#145c43;
    padding:20px;
    border-radius:10px;
    width:300px;
}

input {
    width:90%;
    padding:10px;
    margin:5px;
    font-size:16px;
}
</style>
</head>

<body>

<h1>🛒 Steam Checkout (BLIK fake)</h1>

<div class="money">💰 <span id="money">0</span></div>

<button onclick="openBlik()">💳 Zapłać BLIK</button>

<div class="overlay" id="overlay">
    <div class="popup">

        <h2>💳 BLIK Payment</h2>

        <input maxlength="5" id="code" placeholder="Wpisz 5-cyfrowy kod">
        <input id="amount" type="number" placeholder="Kwota">

        <button onclick="pay()">Zatwierdź</button>
        <button onclick="closeBlik()">Zamknij</button>

        <div id="result"></div>

    </div>
</div>

<script>

let money = parseInt(localStorage.getItem("money")) || 1000;
document.getElementById("money").innerText = money;

function save() {
    localStorage.setItem("money", money);
    document.getElementById("money").innerText = money;
}

function openBlik() {
    document.getElementById("overlay").style.display = "flex";
}

function closeBlik() {
    document.getElementById("overlay").style.display = "none";
}

function pay() {

    let code = document.getElementById("code").value;
    let amount = parseInt(document.getElementById("amount").value);

    // 🔐 walidacja kodu (tylko format jak BLIK)
    if (!/^\d{5}$/.test(code)) {
        document.getElementById("result").innerText = "❌ Kod musi mieć 5 cyfr";
        return;
    }

    if (!amount || amount <= 0) {
        document.getElementById("result").innerText = "❌ Zła kwota";
        return;
    }

    money += amount;

    document.getElementById("result").innerText =
        "🔥 Dodano +" + amount + "$";

    save();
}

</script>

<a href="index.html">dom</a>
</body>
</html>
