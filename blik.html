<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Golden Casino - Doładowanie</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .panel { background: #2d2d2d; padding: 20px; border-radius: 10px; width: 300px; text-align: center; border: 2px solid #ffd700; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
        button { background: #00ff00; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #status { margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Golden Casino - Doładuj</h2>
    <p>Twoje saldo: <span id="displayMoney">0.00</span> PLN</p>
    
    <input type="number" id="amount" placeholder="Kwota doładowania">
    <input type="text" id="blikCode" placeholder="Kod BLIK (6 cyfr)">
    
    <button onclick="dodajSrodki()">Zasil konto</button>
    <div id="status"></div>
</div>

<script>
    // Ładowanie kasy przy starcie
    let money = parseFloat(localStorage.getItem("money")) || 0;
    document.getElementById("displayMoney").innerText = money.toFixed(2);

    function dodajSrodki() {
        const kwota = parseFloat(document.getElementById("amount").value);
        const kodInput = document.getElementById("blikCode").value;
        const status = document.getElementById("status");

        // Walidacja: 6 cyfr i kwota musi być większa od 0
        if (kodInput.length === 6 && kwota > 0) {
            money += kwota; // Teraz dodajemy hajs!
            localStorage.setItem("money", money);
            document.getElementById("displayMoney").innerText = money.toFixed(2);
            
            status.style.color = "#00ff00";
            status.innerText = "Doładowano pomyślnie!";
        } else {
            status.style.color = "#ff4444";
            status.innerText = "Błędny kod lub kwota!";
        }
    }
</script>

<a style="margin-top: 20px;text-decoration: none; color: white;background: rgba(0,0,0,0.5);padding: 8px 15px;border-radius: 5px;font-size: 14px;" href="index.html">← Powrót do domu</a>
</body>
</html>
