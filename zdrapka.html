<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keno - Golden Casino</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#2a8f46,#145c2d);
    font-family:Arial,sans-serif;
    color:white;
}

.card{
    width:500px;
    background:rgba(20,20,20,0.9);
    border-radius:30px;
    padding:35px;
    text-align:center;
    box-shadow:
    0 0 30px rgba(0,0,0,0.6),
    inset 0 0 20px rgba(255,215,0,0.08);
}

h1{
    margin-top:0;
    color:gold;
    text-shadow:0 0 15px rgba(255,215,0,0.5);
}

.money{
    font-size:28px;
    margin:20px 0;
    color:#ffd700;
}

.ball{
    width:140px;
    height:140px;
    margin:25px auto;
    border-radius:50%;
    background:
    radial-gradient(circle at 30% 30%, #ffffff, #dddddd);
    color:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    font-weight:bold;
    box-shadow:
    inset -10px -10px 20px rgba(0,0,0,0.15),
    0 0 30px rgba(255,255,255,0.25);
}

.roll{
    animation:roll 0.08s infinite;
}

@keyframes roll{
    0%{transform:translateY(-4px) rotate(-5deg);}
    50%{transform:translateY(4px) rotate(5deg);}
    100%{transform:translateY(-4px) rotate(-5deg);}
}

button{
    border:none;
    background:linear-gradient(135deg,#ffd700,#ffb700);
    padding:18px 35px;
    border-radius:20px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#result{
    margin-top:25px;
    min-height:40px;
    font-size:26px;
    font-weight:bold;
}

.win{
    color:lime;
    text-shadow:0 0 15px lime;
}

.lose{
    color:#ff5252;
}

.jackpot{
    color:gold;
    text-shadow:0 0 20px gold;
}

.info{
    margin-top:25px;
    background:#222;
    border-radius:20px;
    padding:20px;
    text-align:left;
}
</style>
</head>
<body>

<div class="card">

    <h1>🎰 KENO</h1>

    <div class="money">
        💰 <span id="money">0</span>$
    </div>

    <div class="ball" id="ball">?</div>

    <button id="buyBtn" onclick="buyScratch()">
        🎟 Kup los (25$)
    </button>

    <div id="result"></div>

    <div class="info">
        <b>Szanse:</b>
        <ul>
            <li>🎯 4 → x2</li>
            <li>💎 44 → JACKPOT x444</li>
        </ul>
    </div>

</div>

<a style="margin-top: 20px;text-decoration: none; color: white;background: rgba(0,0,0,0.5);padding: 8px 15px;border-radius: 5px;font-size: 14px;" href="index.html">← Powrót do domu</a>
<script>
let money =
parseInt(localStorage.getItem("money")) || 1000;

const COST = 25;

const moneyText =
document.getElementById("money");

const result =
document.getElementById("result");

const ball =
document.getElementById("ball");

const button =
document.getElementById("buyBtn");

moneyText.innerText = money;

function save(){
    localStorage.setItem("money", money);
    moneyText.innerText = money;
}
document.addEventListener("keydown", function(event){

    if(event.key.toLowerCase() === "t"){

        document.getElementById("buyBtn").click();

    }

});
function buyScratch(){

    if(money < COST){
        result.innerText =
        "❌ Brak pieniędzy";
        result.className = "lose";
        return;
    }

    money -= COST;
    save();

    button.disabled = true;

    result.innerHTML =
    "🎲 Losowanie...";
    result.className = "";

    ball.classList.add("roll");

    let fakeRoll = setInterval(() => {

        ball.innerText =
        Math.floor(Math.random()*50)+1;

    }, 70);

    setTimeout(() => {

        clearInterval(fakeRoll);

        ball.classList.remove("roll");

        let roll =
        Math.floor(Math.random()*50)+1;

        ball.innerText = roll;

        let win = 0;

        if(roll === 4){

            win = COST * 2;

            result.innerHTML =
            `🔥 Trafiłeś 4! +${win}$`;

            result.className = "win";
        }

        else if(roll === 44){

            win = COST * 444;

            result.innerHTML =
            `💎 JACKPOT 44!!! +${win}$`;

            result.className = "jackpot";
        }

        else{

            result.innerHTML =
            `💀 ${roll} → nic`;

            result.className = "lose";
        }

        money += win;

        save();

        button.disabled = false;

    }, 2500);
}
</script>

</body>
</html>
