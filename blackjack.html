<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack - Golden Casino</title>

<style>
body {
    margin: 0;
    background: #0f5132;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.table {
    width: 700px;
    background: #145c43;
    padding: 30px;
    border-radius: 150px 150px 25px 25px; /* Kształt półokrągłego stołu kasynowego */
    border: 15px solid #3a1a00; /* Drewniana rama stołu */
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    margin-bottom: 20px;
}

#money {
    font-size: 28px;
    color: gold;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px black;
}

.section {
    margin: 20px 0;
    background: rgba(0,0,0,0.2);
    padding: 15px;
    border-radius: 15px;
}

.score {
    font-size: 18px;
    color: #ffeb3b;
    margin-bottom: 5px;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 10px;
    min-height: 90px;
    margin-top: 10px;
}

.card {
    width: 65px;
    height: 90px;
    background: white;
    color: black;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 3px 3px 5px rgba(0,0,0,0.3);
    animation: dealCard 0.3s ease-out;
}

.red {
    color: red;
}

@keyframes dealCard {
    0% { transform: translateY(-50px) rotate(-20deg); opacity: 0; }
    100% { transform: translateY(0) rotate(0); opacity: 1; }
}

button, input {
    padding: 12px 25px;
    font-size: 16px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
}

input {
    width: 100px;
    text-align: center;
    background: white;
    color: black;
    border: 2px solid gold;
}

button {
    background: linear-gradient(135deg, gold, #cc9900);
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: scale(1.05);
    background: linear-gradient(135deg, #fff275, gold);
}

button:disabled {
    background: #666;
    color: #999;
    cursor: not-allowed;
    transform: none;
}

#result {
    font-size: 24px;
    font-weight: bold;
    min-height: 35px;
    margin-top: 15px;
    text-shadow: 1px 1px 2px black;
}

.win { color: lime; }
.lose { color: #ff3333; }
.draw { color: lightblue; }
</style>
</head>
<body>

<h1>🃏 Golden Blackjack</h1>
<div id="money">💰 <span id="moneySpan">1000</span>$</div>

<div class="table">
    <!-- Krupier -->
    <div class="section">
        <div class="score">Krupier: <span id="dealerScore">?</span></div>
        <div class="cards" id="dealerCards"></div>
    </div>

    <!-- Gracz -->
    <div class="section">
        <div class="score">Twoje punkty: <span id="playerScore">0</span></div>
        <div class="cards" id="playerCards"></div>
    </div>

    <!-- Interfejs obstawiania -->
    <div id="betPanel">
        <input type="number" id="betAmount" value="5000" min="100">
        <button onclick="startGame()">Postaw i Graj</button>
    </div>

    <!-- Interfejs gry -->
    <div id="gamePanel" style="display: none;">
        <button onclick="hit()" id="hitBtn">Dobierz (Hit)</button>
        <button onclick="stand()" id="standBtn">Pasuj (Stand)</button>
        <button onclick="doubleDown()" id="doubleBtn">Podwój (Double)</button>
    </div>

    <div id="result">Obstaw stawkę, aby zacząć!</div>
</div>

<!-- Twój nowy oficjalny link do domu -->
<a style="margin-top: 20px;text-decoration: none; color: white;background: rgba(0,0,0,0.5);padding: 8px 15px;border-radius: 5px;font-size: 14px; " href="index.html">← Powrót do domu</a>

<script>
let money = parseInt(localStorage.getItem("money")) || 100000;
document.getElementById("moneySpan").innerText = money;

let deck = [];
let playerHand = [];
let dealerHand = [];
let currentBet = 0;
let gameActive = false;

const suits = [
    { symbol: '♠', red: false },
    { symbol: '♥', red: true },
    { symbol: '♦', red: true },
    { symbol: '♣', red: false }
];
const values = [
    { name: '2', value: 2 }, { name: '3', value: 3 }, { name: '4', value: 4 },
    { name: '5', value: 5 }, { name: '6', value: 6 }, { name: '7', value: 7 },
    { name: '8', value: 8 }, { name: '9', value: 9 }, { name: '10', value: 10 },
    { name: 'J', value: 10 }, { name: 'Q', value: 10 }, { name: 'K', value: 10 },
    { name: 'A', value: 11 }
];

function createDeck() {
    deck = [];
    for (let suit of suits) {
        for (let val of values) {
            deck.push({ ...val, suit: suit.symbol, red: suit.red });
        }
    }
    // Tasowanie talii
    for (let i = deck.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
}

function calculateScore(hand) {
    let score = 0;
    let aces = 0;
    
    for (let card of hand) {
        score += card.value;
        if (card.name === 'A') aces++;
    }
    
    // Korekta Asów (jeśli przekracza 21, As liczy się jako 1 zamiast 11)
    while (score > 21 && aces > 0) {
        score -= 10;
        aces--;
    }
    return score;
}

function renderCard(card, elementId, hidden = false) {
    const container = document.getElementById(elementId);
    const cardDiv = document.createElement('div');
    cardDiv.className = 'card';
    
    if (hidden) {
        cardDiv.innerText = '🂠';
        cardDiv.style.background = '#linear-gradient(135deg, #cc0000, #800000)';
        cardDiv.style.color = 'white';
    } else {
        cardDiv.innerText = card.name + card.suit;
        if (card.red) cardDiv.classList.add('red');
    }
    container.appendChild(cardDiv);
}

function updateUI(hideDealerCard = true) {
    document.getElementById("playerCards").innerHTML = "";
    document.getElementById("dealerCards").innerHTML = "";
    
    playerHand.forEach(card => renderCard(card, "playerCards"));
    
    if (hideDealerCard) {
        renderCard(dealerHand[0], "dealerCards");
        renderCard(null, "dealerCards", true);
        document.getElementById("dealerScore").innerText = dealerHand[0].value;
    } else {
        dealerHand.forEach(card => renderCard(card, "dealerCards"));
        document.getElementById("dealerScore").innerText = calculateScore(dealerHand);
    }
    
    document.getElementById("playerScore").innerText = calculateScore(playerHand);
    document.getElementById("moneySpan").innerText = money;
}

function startGame() {
    let betInput = document.getElementById("betAmount");
    currentBet = parseInt(betInput.value);
    
    if (isNaN(currentBet) || currentBet <= 0) {
        alert("Wpisz poprawną stawkę!");
        return;
    }
    if (currentBet > money) {
        document.getElementById("result").innerText = "❌ Brak wystarczających funduszy!";
        document.getElementById("result").className = "lose";
        return;
    }
    
    money -= currentBet;
    localStorage.setItem("money", money);
    
    createDeck();
    playerHand = [deck.pop(), deck.pop()];
    dealerHand = [deck.pop(), deck.pop()];
    
    document.getElementById("betPanel").style.display = "none";
    document.getElementById("gamePanel").style.display = "block";
    document.getElementById("doubleBtn").disabled = false; // Reset przycisku double
    document.getElementById("result").innerText = "Twój ruch! Dobierasz czy pasujesz?";
    document.getElementById("result").className = "";
    
    gameActive = true;
    updateUI(true);
    
    // Sprawdzenie naturalnego Blackjacka na start (21 punktów)
    if (calculateScore(playerHand) === 21) {
        stand();
    }
}

function hit() {
    if (!gameActive) return;
    
    // Po pierwszym dobraniu karty nie można już zrobić Double Down
    document.getElementById("doubleBtn").disabled = true;
    
    playerHand.push(deck.pop());
    let playerScore = calculateScore(playerHand);
    updateUI(true);
    
    if (playerScore > 21) {
        endGame("lose", `💀 Fura! Przekroczyłeś 21 punktów (${playerScore}). Przegrana!`);
    }
}

function doubleDown() {
    if (!gameActive) return;
    
    // Sprawdzamy czy gracz ma kasę na podwojenie zakładu
    if (currentBet > money) {
        alert("Nie masz wystarczająco pieniędzy na podwojenie stawki!");
        return;
    }
    
    money -= currentBet;
    currentBet *= 2; // Podwojenie stawki na stole
    localStorage.setItem("money", money);
    
    // W zasadach kasynowych Double daje TYLKO JEDNĄ kartę i automatycznie kończy ruch!
    playerHand.push(deck.pop());
    updateUI(true);
    
    let playerScore = calculateScore(playerHand);
    if (playerScore > 21) {
        endGame("lose", `💀 Fura po podwojeniu! Masz ${playerScore} punktów. Przegrana!`);
    } else {
        stand(); // Jeśli nie ma fury, automatycznie pasujemy i ruch ma krupier
    }
}

function stand() {
    if (!gameActive) return;
    
    gameActive = false;
    updateUI(false); // Odkrywamy ukrytą kartę krupiera
    
    let dealerScore = calculateScore(dealerHand);
    
    // Krupier dobiera karty dopóki ma mniej niż 17 punktów
    let dealerInterval = setInterval(() => {
        if (dealerScore < 17) {
            dealerHand.push(deck.pop());
            dealerScore = calculateScore(dealerHand);
            updateUI(false);
        } else {
            clearInterval(dealerInterval);
            determineWinner();
        }
    }, 800); // 0.8 sekundy odstępu, żeby ładnie było widać jak krupier dobiera
}

function determineWinner() {
    let playerScore = calculateScore(playerHand);
    let dealerScore = calculateScore(dealerHand);
    
    if (dealerScore > 21) {
        endGame("win", `🔥 Krupier przekroczył 21! Wygrywasz +${currentBet * 2}$!`);
    } else if (playerScore > dealerScore) {
        endGame("win", `🎉 Wygrywasz! Masz lepszy układ (${playerScore} vs ${dealerScore}). Wpada +${currentBet * 2}$!`);
    } else if (playerScore < dealerScore) {
        endGame("lose", `💀 Przegrana! Krupier ma lepszy układ (${dealerScore} vs ${playerScore}).`);
    } else {
        endGame("draw", `🤝 Remis (Stoisz w miejscu)! Obaj macie po ${playerScore} punktów. Zwrot stawki.`);
    }
}

function endGame(status, msg) {
    gameActive = false;
    
    if (status === "win") {
        money += currentBet * 2;
        document.getElementById("result").className = "win";
    } else if (status === "draw") {
        money += currentBet;
        document.getElementById("result").className = "draw";
    } else {
        document.getElementById("result").className = "lose";
    }
    
    localStorage.setItem("money", money);
    document.getElementById("moneySpan").innerText = money;
    document.getElementById("result").innerText = msg;
    
    // Zmiana paneli z powrotem na stawianie
    document.getElementById("betPanel").style.display = "block";
    document.getElementById("gamePanel").style.display = "none";
}
</script>
</body>
</html>
