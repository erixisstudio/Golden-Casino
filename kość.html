<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps - Golden Casino</title>
</head>
<body>
    <h2>Craps</h2>

<div>💰 <span id="money">0</span></div>

<input type="number" id="betNum" min="1" max="6" placeholder="1-6">
<input type="number" id="betAmount" placeholder="stawka">

<button onclick="rollDice()">Rzuć</button>

<div id="diceResult"></div>
<style>
    body{
    background:#45bd4f;
    }
</style>
<script>
let money = parseInt(localStorage.getItem("money")) || 1000;
document.getElementById("money").innerText = money;

function save() {
    localStorage.setItem("money", money);
    document.getElementById("money").innerText = money;
}
document.addEventListener("DOMContentLoaded", function() {
    let money = parseInt(localStorage.getItem("money")) || 1000;
    document.getElementById("money").innerText = money;
});
function rollDice() {
localStorage.setItem("money", money);
    let guess = parseInt(document.getElementById("betNum").value);
    let bet = parseInt(document.getElementById("betAmount").value);

    if (bet > money) return;

    money -= bet;

    let roll = Math.floor(Math.random() * 6) + 1;

    let win = "";

    if (guess === roll) {
        money += bet * 6;
        win = "🔥 WIN + " + bet * 6;
    } else {
        win = "💀 LOST - " + bet;
    }

    document.getElementById("diceResult").innerText = "Wynik: " + roll + " | " + win;

    save();
    localStorage.setItem("money", money);
}
</script>
<a href="głownastrona.html">dom</a>
</body>
</html>
